<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Northstar 1688采集</title></head>
<body>
  <header><span>N</span><div><b>Northstar</b><small>1688 商品采集</small></div></header>
  <main>
    <label>ERP网址<input id="erpUrl" type="url" placeholder="https://erp.example.com" autocomplete="url"><small id="erpUrlHint">首次填写后自动记住</small></label>
    <button id="scanBtn" type="button">读取当前1688商品 <span>→</span></button>
    <section id="preview" class="hidden">
      <div class="product"><img id="productImage" alt=""><div><b id="productTitle"></b><small id="productMeta"></small></div></div>
      <div id="captureSummary" class="capture-summary"></div>
      <div class="toolbar"><label><input id="selectAll" type="checkbox" checked> 全选SKU</label><strong id="skuCount"></strong></div>
      <div id="skuList" class="sku-list"></div>
      <button id="sendBtn" type="button">发送到ERP第一阶段 <span>→</span></button>
    </section>
    <p id="status">请先登录1688并打开一个商品详情页。</p>
  </main>
  <footer>0.3.4 · SKU规格逐项绑定并还原高清原图，不保存1688密码或Cookie</footer>
  <script src="popup.js"></script>
</body>
</html>
