[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-skill"
version = "0.1.0"
description = "1688 to OZON product pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
collect-1688 = "ozon_skill.alphashop.cli:main"
collect-alphashop = "ozon_skill.alphashop.cli:main"
collect-1688-open-platform = "ozon_skill.alibaba1688.cli:main"
map-ozon-category = "ozon_skill.category_mapping.cli:main"
generate-ozon-content = "ozon_skill.content_generation.cli:main"
upload-ozon-product = "ozon_skill.upload.cli:main"
ozon-erp = "ozon_skill.erp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ozon_skill.erp" = ["static/*.html", "static/*.css", "static/*.js", "data/*.json.gz"]

